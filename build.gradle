plugins {
    id 'base'
}

// Aggregator: one Gradle plugin jar per v*/LICENSE.md (built inside :dmsal-gradle-plugin).

tasks.named('clean') {
    dependsOn ':dmsal-gradle-plugin:clean'
}

tasks.named('build') {
    dependsOn('clean')
    dependsOn ':dmsal-gradle-plugin:pluginJars'
}

// Single publishing entry for the whole repo (IDEA + CLI).
tasks.register('publishToMavenLocal') {
    group = 'publishing'
    description = 'Clean + build plugin jars, then publish ALL versions (+ markers) to Maven Local'
    dependsOn ':dmsal-gradle-plugin:pluginJars'
    dependsOn ':dmsal-gradle-plugin:publishAllPluginsToMavenLocal'
}
